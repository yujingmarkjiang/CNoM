defaults:
  - ../base.yaml
  - ../models/video_swin_t.yaml
output_dir: runs/teacher_video_swin
stage: teacher
model:
  name: video_swin_t
  num_classes: 9
  num_frames: 32
  image_size: 224
training:
  epochs: 30
  batch_size: 8
  gradient_accumulation: 4
  learning_rate: 0.00002
  warmup_epochs: 4
loss:
  supervised_weight: 1.0
  supervised_contrastive_weight: 0.1
  distillation_weight: 0.0
  false_negative_weight: 0.0
  hard_negative_weight: 0.0
