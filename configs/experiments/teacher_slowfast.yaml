defaults:
  - ../base.yaml
  - ../models/slowfast_r50.yaml
output_dir: runs/teacher_slowfast
stage: teacher
model:
  name: slowfast_r50
  repository: facebookresearch/pytorchvideo
  source: github
  pretrained: true
  num_classes: 9
  num_frames: 32
  image_size: 256
training:
  epochs: 30
  batch_size: 4
  gradient_accumulation: 8
  learning_rate: 0.00002
  warmup_epochs: 4
loss:
  supervised_weight: 1.0
  supervised_contrastive_weight: 0.1
  distillation_weight: 0.0
  false_negative_weight: 0.0
  hard_negative_weight: 0.0
