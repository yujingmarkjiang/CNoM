defaults:
  - ../base.yaml
  - ../models/timesformer.yaml
output_dir: runs/teacher_timesformer
stage: teacher
model:
  name: timesformer
  pretrained_id: facebook/timesformer-base-finetuned-k400
  num_classes: 9
  num_frames: 8
  image_size: 224
training:
  epochs: 30
  batch_size: 8
  gradient_accumulation: 4
  learning_rate: 0.00001
  warmup_epochs: 5
loss:
  supervised_weight: 1.0
  supervised_contrastive_weight: 0.1
  distillation_weight: 0.0
  false_negative_weight: 0.0
  hard_negative_weight: 0.0
