defaults:
  - ../base.yaml
  - ../models/mgfn.yaml
output_dir: runs/mgfn
stage: anomaly
dataset:
  manifest: data/anomaly_features.parquet
  feature_column: feature_path
  binary_labels: true
  class_balance: weighted
model:
  name: mgfn
  feature_dim: 768
  hidden_dim: 512
  num_stages: 3
  num_heads: 8
  dropout: 0.3
  num_classes: 2
training:
  epochs: 50
  batch_size: 32
  gradient_accumulation: 1
  learning_rate: 0.0001
  weight_decay: 0.0005
  early_stopping_patience: 10
loss:
  supervised_weight: 1.0
  supervised_contrastive_weight: 0.0
  distillation_weight: 0.0
  false_negative_weight: 0.5
  hard_negative_weight: 0.0
  positive_class_weight: 2.0
