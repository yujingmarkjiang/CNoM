defaults:
  - ../base.yaml
  - ../models/videomae.yaml
output_dir: runs/teacher_videomae
stage: teacher
model:
  name: videomae
  pretrained_id: MCG-NJU/videomae-base-finetuned-kinetics
  num_classes: 9
  num_frames: 16
  image_size: 224
training:
  epochs: 30
  batch_size: 8
  gradient_accumulation: 4
  learning_rate: 0.00001
  warmup_epochs: 5
loss:
  supervised_weight: 1.0
  supervised_contrastive_weight: 0.1
  distillation_weight: 0.0
  false_negative_weight: 0.0
  hard_negative_weight: 0.0
